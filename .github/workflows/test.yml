name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No ComfyUI, no GPU, no model weights: everything below the node layer
      # (store, pyramid, archive, hilbert, metadata) runs on its own.
      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow aiohttp -r requirements.txt

      - name: Modules import without ComfyUI
        run: python -c "import sys; sys.path.insert(0, '.'); import tilestore, archive, hilbert, promptmeta, paths, routes; print('ok')"

      - name: Test suite
        run: python tools/pmtiles_map_test.py --out "${{ runner.temp }}/pmtiles-test"

      - name: Upload the pyramid contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contact-sheets-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/pmtiles-test/level_z*.png
          if-no-files-found: warn
