<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  :root { --bg:#16181d; --panel:#1e2128; --line:#2e323c; --fg:#e6e8ee; --dim:#9aa1b1; --accent:#7cc4ff; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:var(--fg);
         font:13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:8px 12px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header .spacer { flex:1; }
  .dim { color:var(--dim); font-variant-numeric:tabular-nums; }
  main { flex:1; display:flex; min-height:0; }
  #map { flex:1; background:#0d0f13; }
  aside { width:320px; flex:none; overflow-y:auto; padding:12px;
          border-left:1px solid var(--line); background:var(--panel); }
  input[type=search] { width:100%; background:#262a33; color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:5px 8px; font:inherit; }
  input[type=search]:focus { outline:none; border-color:var(--accent); }
  ol { list-style:none; margin:8px 0 0; padding:0; }
  li { padding:5px 6px; border-radius:5px; cursor:pointer; display:flex; gap:8px;
       border:1px solid transparent; }
  li:hover { background:#262a33; border-color:var(--line); }
  .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .coord { color:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  dt { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  dd { margin:2px 0 10px; word-break:break-word; white-space:pre-wrap; }
  .leaflet-container { background:#0d0f13; }
  .leaflet-control-attribution { background:rgba(30,33,40,.8)!important; color:var(--dim)!important; }
  .leaflet-control-attribution a { color:var(--dim)!important; }
</style>
</head>
<body>
<header>
  <strong>__TITLE__</strong>
  <span id="stats" class="dim"></span>
  <span class="spacer"></span>
  <span class="dim">read straight from the .pmtiles by range request</span>
</header>
<main>
  <div id="map"></div>
  <aside>
    <input id="q" type="search" placeholder="search title, tags, prompt" autocomplete="off">
    <div id="hint" class="dim" style="font-size:11px;margin-top:6px"></div>
    <ol id="results"></ol>
    <div id="detail"></div>
  </aside>
</main>

<!-- Leaflet must load first: leafletRasterLayer extends L.GridLayer. -->
<script src="leaflet/leaflet.js"></script>
<script src="pmtiles/pmtiles.js"></script>
<script src="config.js"></script>
<script src="static.js"></script>
</body>
</html>
