<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMTiles map</title>
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/viewer.css">
</head>
<body>
<header>
  <button id="left-toggle" class="icon" title="hide/show the panel (key: b)">☰</button>
  <label>map
    <select id="map-picker" title="press 1–9 to switch archive; the view is kept
so two renderings of the same index can be compared"></select>
  </label>
  <label title="store: live tiles straight from SQLite, the archive is never touched.
archive: reads the .pmtiles itself — what would be uploaded to a CDN.">src
    <select id="source-picker">
      <option value="auto">auto</option>
      <option value="store">store</option>
      <option value="archive">archive</option>
    </select>
  </label>
  <span id="stats" class="stats">loading…</span>
  <span class="spacer"></span>
  <label class="toggle"><input type="checkbox" id="grid-toggle"> tile grid</label>
  <label class="toggle" title="shift-drag to select tiles, ctrl-drag for a second
group, alt-drag to erase. Esc clears. (key: x)"><input type="checkbox" id="select-toggle"> select</label>
  <label class="toggle" title="per-tile z/x/y, map zoom and corner lat/lng, with the
border coloured when the tile is upscaled or over-zoomed rather than stored (key: d)"><input type="checkbox" id="debug-toggle"> debug</label>
  <span id="sel-info" class="sel-info" hidden>
    <span id="sel-count"></span>
    <button id="sel-copy" class="icon" title="copy the selected coordinates as JSON">copy</button>
    <button id="sel-clear" class="icon" title="clear the selection (Esc)">clear</button>
  </span>
  <label class="toggle"><input type="checkbox" id="live-toggle" checked> live</label>
  <label class="toggle" title="flash tiles as they change"><input type="checkbox" id="flash-toggle" checked> flash</label>
  <button id="reload-tiles" class="icon" title="refetch every visible tile (key: r)">⟳</button>
  <button id="build-map" class="icon" title="build the zoom pyramid and re-serialize the archive">⛰ build</button>
  <span id="pulse" class="pulse"></span>
</header>

<main>
  <aside id="left">
    <div class="tabs" role="tablist">
      <button id="tab-search" class="tab active" role="tab">search</button>
      <button id="tab-saved" class="tab" role="tab">liked <span id="saved-count" class="badge"></span></button>
    </div>

    <section id="pane-search" class="pane-body" role="tabpanel">
      <input id="search-input" type="search" autocomplete="off"
             placeholder="title, tags, prompt  ( / )">
      <div id="search-hint" class="hint"></div>
      <ol id="search-results" class="list"></ol>
    </section>

    <section id="pane-saved" class="pane-body" role="tabpanel" hidden>
      <div class="actions">
        <button id="save-tile" title="save the selected tile (key: s)">+ tile</button>
        <button id="saved-copy" title="copy the list to the clipboard as JSON">copy</button>
        <button id="saved-paste" title="replace the list from clipboard JSON">paste</button>
      </div>
      <div id="saved-msg" class="hint"></div>
      <ol id="saved-list" class="list"></ol>
      <div id="saved-empty" class="hint">Click a tile on the map, then “+ tile”.
        Drag to reorder, double-click a name to rename.</div>
    </section>
  </aside>

  <div id="map"></div>

  <aside id="side">
    <div id="side-empty" class="empty">Click a tile to see how it was made.</div>
    <div id="side-body" hidden>
      <div class="coord">
        <code id="tile-coord"></code>
        <button id="copy-coord" title="copy z/x/y">copy</button>
        <button id="open-preview" title="full original image (or double-click the map)">⤢</button>
      </div>
      <img id="tile-thumb" alt="tile">
      <dl id="tile-fields"></dl>
      <details id="tile-raw-wrap">
        <summary>raw metadata</summary>
        <pre id="tile-raw"></pre>
      </details>
    </div>
  </aside>
</main>

<div id="preview" hidden>
  <div id="preview-frame">
    <img id="preview-img" alt="full render">
    <div id="preview-bar">
      <span id="preview-caption"></span>
      <span class="spacer"></span>
      <a id="preview-link" href="#" target="_blank" rel="noopener">open raw</a>
      <button id="preview-close" class="icon" title="close (Esc)">✕</button>
    </div>
  </div>
</div>

<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/viewer.js"></script>
<script src="assets/overlays.js"></script>
</body>
</html>
